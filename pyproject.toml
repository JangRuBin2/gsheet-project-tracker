[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gsheet-project-tracker"
version = "0.4.0"
description = "Google Sheets 기반 프로젝트 일정·진척 관리 CLI"
requires-python = ">=3.10"
dependencies = [
    "google-api-python-client>=2.100",
    "google-auth>=2.20",
    "google-auth-oauthlib>=1.0",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
gtrack = "gtrack.cli:main"

[tool.setuptools]
packages = ["gtrack"]

[tool.pytest.ini_options]
testpaths = ["tests"]
